{% extends "base.html" %}
{% block title %}Edit {{ package.package_name }} | Wanderlust Hyderabad{% endblock %}

{% block content %}
<section class="form-hero d-flex align-items-center">
  <div class="hero-overlay"></div>
  <div class="container position-relative text-white text-center py-4">
    <h2 class="fw-bold mb-0">Edit Package: {{ package.package_name }}</h2>
  </div>
</section>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm p-4 p-md-5">
        <form method="post">
          {% include "_form_fields.html" %}
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{{ url_for('package_detail', package_id=package.id) }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-warning fw-semibold px-4">
              <i class="bi bi-check-circle me-1"></i> Update Package
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
